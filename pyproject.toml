[project]
name = "orgsync"
version = "0.1.0"
description = "Keeps every repo in a GitHub org in the same state, without an enterprise plan."
requires-python = ">=3.12"
dependencies = ["PyYAML>=6"]

[project.scripts]
orgsync = "orgsync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orgsync*"]
