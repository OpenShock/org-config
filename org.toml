# Desired state for every repo in the org.
# `python -m orgsync plan` shows where reality differs, `apply` fixes it.
# Archived repos, forks and empty repos are always ignored.

org = "OpenShock"
# `apply` refuses to run as anyone else.
bot_account = "hhvrc"
# Repos no check should ever touch.
exclude = []

# Any section below also accepts `include`, `exclude` and `visibility = "public" | "private"`.

# --- managed files: copied from a template, {org}, {repo} and the rule's own `vars` are substituted ---

# SECURITY.md is not managed: every repo inherits the policy in the .github repo, see community.forbidden_files.

# Owners are always named users, never a team: a team is ignored unless it has write access to the repo.
[[files.managed]]
path = ".github/CODEOWNERS"
template = "templates/CODEOWNERS"
visibility = "public"
exclude = [".github"]
remove = ["CODEOWNERS", "docs/CODEOWNERS"]
# {owners} is who reviews everything else, /SECURITY.md and /.github/ stay with the two maintainers.
vars = { owners = "@hhvrc @LucHeart" }

# Repos whose default owners differ from that, in who they are or in who is asked first.
[files.managed.repo_vars]
API = { owners = "@LucHeart @hhvrc" }
3DPrints = { owners = "@nullstalgia @LucHeart @hhvrc" }
Firmware = { owners = "@hhvrc @nullstalgia @LucHeart" }
Hardware = { owners = "@nullstalgia @LucHeart @hhvrc" }
flatbuffers-schemas = { owners = "@hhvrc @LucHeart @nullstalgia" }

# --- renovate.json: every repo owns its rules ---
# The only thing enforced is that an existing renovate.json extends the shared presets in renovate/.
# Renovate is never added to a repo, and a file that already extends the presets is never touched.
# Rules for one repo belong in that repo's own file, after the presets.

[renovate]
path = "renovate.json"
# How Renovate reaches this repo, the preset's path without .json is appended.
source = "local>{org}/org-config//"
presets = ["renovate/default.json", "renovate/automerge.json"]
# A rule that leaves the presets for the one repo that needs it waits in renovate/handover/<Repo>.json
# until that repo's renovate.json carries it. Delete the file once that is merged, the repo owns the rule from then on.

# --- community health files ---
# Report-only unless stated otherwise. `files` and `any_of` are regexes matched against the whole path.

# The hand-written security policies must keep the shared reporting block.
# The numbers live in four places: the org policy and these three files.
[[community.must_contain]]
name = "shared reporting block"
include = ["API", "Frontend", "Firmware"]
files = ["SECURITY\\.md"]
missing = "report"
contains = [
    "https://github.com/{org}/.github/blob/main/SECURITY.md",
    "https://github.com/{org}/{repo}/security/advisories/new",
    "security@openshock.org",
    "within 3 working days (7 days at most)",
    "triage result within 14 days",
    "default deadline of 90 days",
]

# A local CONTRIBUTING.md replaces the org one entirely, so it has to link back.
[[community.must_contain]]
name = "link to the org contributing guide and the security notice"
visibility = "public"
exclude = [".github"]
files = ["(\\.github/|docs/)?CONTRIBUTING\\.md"]
contains = ["https://github.com/{org}/.github/blob/main/CONTRIBUTING.md", "SECURITY"]

# The policy must be discoverable from the README, not only from the Security tab.
# A link to the org policy counts, and so does one to the repo's own file where it has one.
[[community.must_contain]]
name = "README link to the security policy"
visibility = "public"
exclude = [".github"]
files = ["(?i)readme\\.md"]
contains = ["SECURITY.md"]

# security@ is the security contact, admin@ stays for code of conduct and privacy matters.
[[community.must_not_contain]]
reason = "admin@openshock.org used as a security contact, should be security@openshock.org"
visibility = "public"
files = ["(\\.github/|docs/)?SECURITY\\.md", "\\.github/ISSUE_TEMPLATE/.*"]
pattern = "admin@openshock\\.org"

[[community.must_not_contain]]
reason = "admin@openshock.org used as a security contact, should be security@openshock.org"
visibility = "public"
files = ["(?i)readme\\.md", "(\\.github/|docs/)?CONTRIBUTING\\.md"]
pattern = "(secur|vulnerab).*admin@openshock\\.org|admin@openshock\\.org.*(secur|vulnerab)"

# Inherited from the .github repo, a local copy shadows the org version and drifts.
[[community.forbidden_files]]
reason = "inherited from the .github repo"
exclude = [".github"]
files = ["(\\.github/|docs/)?(CODE_OF_CONDUCT|SUPPORT)\\.md", "\\.github/VULNERABILITY_REPORT\\.ya?ml"]
# Removed through a PR, set to false to only report them.
delete = true

# The security policy is inherited the same way, so a local copy would replace the whole org policy.
# API, Frontend and Firmware carry hand-written files with component-specific scope.
[[community.forbidden_files]]
reason = "the security policy is inherited from the .github repo"
exclude = [".github", "API", "Frontend", "Firmware"]
files = ["(\\.github/|docs/)?SECURITY\\.md"]
delete = true

# Not inheritable, every repo needs its own.
[[community.required_files]]
name = "CODEOWNERS"
visibility = "public"
any_of = ["(\\.github/|docs/)?CODEOWNERS"]

# A repo with its own issue templates inherits none of the org ones, including the security contact link.
[community.issue_templates]
enabled = true
visibility = "public"
exclude = [".github"]
# Creates config.yml when there is none. An existing one without the link is only reported.
create_missing = true

# --- GitHub Actions ---

[actions]
# Versions and SHA pins are kept current by Renovate, this only decides which actions may be used.
# Anything from these owners is fine.
allowed_owners = ["actions", "github", "docker", "OpenShock"]
# Individually approved third-party actions.
allowed = [
    "NuGet/login",
    "pnpm/action-setup",
    "gradle/actions",
    "pypa/gh-action-pypi-publish",
    "espressif/install-esp-idf-action",
    "flipperdevices/flipperzero-ufbt-action",
]
# Banned actions that have a rewriter are replaced automatically, the rest are reported.
rewrite_banned = true

[actions.banned]
"softprops/action-gh-release" = "use `gh release create`"
"robinraju/release-downloader" = "use OpenShock/actions/release-download"
"peter-evans/repository-dispatch" = "use OpenShock/actions/repository-dispatch"
"peter-evans/create-pull-request" = "use OpenShock/actions/open-pr-from-diff"
"oprypin/find-latest-tag" = "use OpenShock/actions/find-latest-tag"
"joncloud/makensis-action" = "use OpenShock/actions/nsis-build"
"stefanzweifel/git-auto-commit-action" = "use OpenShock/actions/auto-commit"

# --- Directory.Build.props: these properties are set, everything else is left alone ---

[msbuild.properties]
Company = "OpenShock"
Authors = "OpenShock"
RepositoryUrl = "https://github.com/{org}/{repo}"
RepositoryType = "git"
PackageProjectUrl = "https://openshock.org"
# PackageLicenseExpression = "AGPL-3.0-or-later"

# --- repository rulesets, matched by name ---
# rulesets/shared/        rulesets used by many repos, assigned below.
# rulesets/repos/<Repo>/  rulesets for that one repo, picked up automatically.
#                         A ruleset there whose `name` field equals a shared one's replaces it for that repo.
# `python -m orgsync import-rulesets` copies rulesets that exist on GitHub but not here into rulesets/repos/.

[rulesets]
# Rulesets on GitHub with no file here are deleted, so the files are the only source of truth.
# Set to false to only report them.
prune = true

[[rulesets.managed]]
file = "rulesets/shared/main-branches.json"

# The default branch only takes squash merges, through a pull request.
# Other main branches are left out so develop can still be merged into master with its history.
# The maintainer team and repo admins can bypass it, and so can Renovate when it merges its own pull requests.
[[rulesets.managed]]
file = "rulesets/shared/squash-merges.json"
visibility = "public"

# On top of that: changes need one approval from a code owner.
# Same bypass list, so Renovate merges non-major updates once CI passes.
[[rulesets.managed]]
file = "rulesets/shared/pull-requests.json"
include = ["API", "Awesome", "Desktop", "Firmware", "Frontend"]

# Firmware's release workflow writes to its release branches through the openshock-release-bot app.
[rulesets.managed.extra_bypass]
Firmware = [{ actor_id = 4141223, actor_type = "Integration", bypass_mode = "always" }]

# --- repository settings ---

[settings.all]
# delete_branch_on_merge = true
# Careful: on private repos the free plan has no rulesets, so nothing would stop this
# from deleting `develop` after a develop -> master PR.
# Also possible: allow_squash_merge, allow_merge_commit, allow_rebase_merge, allow_auto_merge, allow_update_branch.

[settings.public]
secret_scanning = true
secret_scanning_push_protection = true
vulnerability_alerts = true
# The security policy points reporters at this.
private_vulnerability_reporting = true

[settings.private]
vulnerability_alerts = true

# --- orphaned branches ---
# Destructive: planned on every run, but only applied with `apply --check branches`.

[branches]
prefixes = ["feat/", "feature/", "fix/", "bugfix/", "hotfix/", "chore/", "docs/", "refactor/", "test/", "ci/", "build/", "perf/", "dependabot/"]
# Never deleted, on top of each repo's default branch.
protected = ["master", "main", "develop", "beta"]
# Unmerged branches older than this are reported.
stale_days = 90
# Set to true to delete them instead of reporting them.
delete_stale_unmerged = false
