name: sync-direct

# Pushes the files org.toml marks as `direct`, such as renovate.json, to every repo that uses them.
# The presets in renovate/ are read by Renovate straight from this repo and need no sync.
on:
  push:
    branches: [master]
    paths:
      - org.toml
      - templates/renovate/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-direct
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - run: pip install .

      # The workflow's own token cannot write to other repos.
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ORG_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - run: python -m orgsync apply --check files --only-direct --yes
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
